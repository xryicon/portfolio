<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101820">
  <title>Enquiries · ryndendesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'DM Sans',Arial,sans-serif;color:#eaf0e9;background:#101820}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#294838 0,transparent 28%),#101820}button,input{font:inherit}button{cursor:pointer}a{color:inherit}
    .wrap{width:min(1160px,calc(100% - 40px));margin:auto}.top{height:84px;border-bottom:1px solid #35443d;display:flex;align-items:center;justify-content:space-between}.brand{font:700 25px 'Space Grotesk',sans-serif;letter-spacing:-.08em;text-decoration:none}.brand span{color:#d9f773}.back{font-size:13px;text-decoration:none;color:#c2d0c4}.back:hover{color:#d9f773}
    .login{max-width:460px;margin:clamp(70px,12vh,150px) auto 80px}.eyebrow{color:#d9f773;font-size:12px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.eyebrow:before{content:'';display:inline-block;width:25px;height:2px;background:currentColor;vertical-align:middle;margin-right:11px}.login h1,.panel h1{font:600 clamp(42px,6vw,72px)/1 'Space Grotesk',sans-serif;letter-spacing:-.075em;margin:20px 0}.login p{color:#b6c5b9;line-height:1.6}.card{margin-top:34px;padding:30px;background:#1c2b28;border:1px solid #48614d;border-radius:16px;box-shadow:0 22px 60px #0004}.card label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}.card input{width:100%;height:52px;background:#101e1c;border:1px solid #5a7160;color:white;border-radius:9px;padding:0 15px;outline:none}.card input:focus{border-color:#d9f773;box-shadow:0 0 0 3px #d9f77330}.primary{background:#d9f773;color:#172221;border:0;border-radius:9px;padding:14px 22px;font-weight:700}.primary:hover{background:#eaffab}.primary:disabled{opacity:.6;cursor:wait}.card .primary{width:100%;margin-top:16px}.error{color:#ffb7a8!important;min-height:20px;font-size:13px;margin:12px 0 0!important}
    .panel{padding:56px 0 90px}.panelhead{display:flex;align-items:end;justify-content:space-between;gap:20px}.panel h1{margin:12px 0 8px}.subtitle{color:#b6c5b9;margin:0}.actions{display:flex;gap:12px}.secondary{background:transparent;border:1px solid #738975;border-radius:9px;color:#eaf0e9;padding:11px 16px}.secondary:hover{border-color:#d9f773;color:#d9f773}.overview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:42px 0 17px;color:#aebfb1;font-size:13px}.overview strong{color:#eaf0e9}.search{width:min(310px,100%);height:42px;border:1px solid #506559;border-radius:8px;background:#1c2b28;color:#fff;padding:0 13px;outline:none}.search:focus{border-color:#d9f773}.grid{display:grid;grid-template-columns:330px 1fr;min-height:510px;border:1px solid #45594b;border-radius:16px;overflow:hidden;background:#172420}.list{border-right:1px solid #45594b;max-height:690px;overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #34473b;background:transparent;color:#eaf0e9;padding:19px 20px}.item:hover,.item.active{background:#263c2f}.item.active{box-shadow:inset 3px 0 #d9f773}.item .row{display:flex;justify-content:space-between;gap:8px;align-items:start}.item strong{font-size:15px}.item time{font-size:11px;color:#a8b8aa;white-space:nowrap}.item .subject{display:block;color:#d9f773;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}.item .snippet{display:block;color:#aebfb1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}.detail{padding:35px 38px;min-width:0}.detail h2{font:600 32px 'Space Grotesk',sans-serif;letter-spacing:-.05em;margin:8px 0 8px}.detail .meta{color:#aebfb1;font-size:13px;margin:0 0 28px}.email{display:inline-flex;align-items:center;gap:8px;border:1px solid #668066;border-radius:100px;color:#d9f773;text-decoration:none;padding:9px 14px;font-size:13px;max-width:100%;overflow-wrap:anywhere}.email:hover{background:#2d4936}.message{margin-top:32px;border-top:1px solid #405747;padding-top:25px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;color:#dce6dd}.empty{color:#aec0af;padding:30px;line-height:1.6}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:18px;color:#b5c5b7;font-size:13px}.pagination button:disabled{opacity:.4;cursor:default}.notice{color:#ffb7a8;min-height:22px;margin-top:18px}
    [hidden]{display:none!important}@media(max-width:720px){.top{height:70px}.panel{padding-top:38px}.panelhead{align-items:start}.panel h1{font-size:48px}.actions{flex-direction:column}.overview{align-items:stretch;flex-direction:column}.search{width:100%}.grid{display:block}.list{border-right:0;border-bottom:1px solid #45594b;max-height:330px}.detail{padding:27px 23px;min-height:300px}}
  </style>
</head>
<body>
  <header class="wrap top"><a class="brand" href="/" aria-label="ryndendesign home">ryndendesign<span>.</span></a><a class="back" href="/">← Back to website</a></header>
  <main class="wrap">
    <section class="login" id="login-view" hidden>
      <div class="eyebrow">Private workspace</div><h1>Your enquiry inbox.</h1><p>Sign in to read messages sent through your website. Client details stay private.</p>
      <form class="card" id="login-form"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button class="primary" type="submit">Open inbox ↗</button><p class="error" id="login-error" role="alert"></p></form>
    </section>
    <section class="panel" id="panel-view" hidden>
      <div class="panelhead"><div><div class="eyebrow">Private workspace</div><h1>Enquiries<span style="color:#d9f773">.</span></h1><p class="subtitle">Messages from your website contact form.</p></div><div class="actions"><button class="secondary" id="refresh" type="button">Refresh</button><button class="secondary" id="logout" type="button">Sign out</button></div></div>
      <div class="overview"><strong id="count">Your messages</strong><input class="search" id="search" type="search" placeholder="Search this page" aria-label="Search enquiries on this page"></div>
      <div class="grid"><div class="list" id="list" aria-label="Enquiries"></div><article class="detail" id="detail"><p class="empty">Select a message to read it.</p></article></div>
      <div class="pagination"><button class="secondary" id="previous" type="button">← Previous</button><span id="page-label">Page 1</span><button class="secondary" id="next" type="button">Next →</button></div><p class="notice" id="notice" role="status"></p>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let page=1,rows=[],hasMore=false,selected=null;
    const showLogin=()=>{$('login-view').hidden=false;$('panel-view').hidden=true};
    const showPanel=()=>{$('login-view').hidden=true;$('panel-view').hidden=false};
    const date=value=>new Date(value).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
    function render(){
      const query=$('search').value.trim().toLowerCase();
      const visible=rows.filter(x=>(x.name+' '+x.email+' '+x.message).toLowerCase().includes(query));
      $('count').textContent=rows.length+' '+(rows.length===1?'enquiry':'enquiries')+(query?' · '+visible.length+' matching':'');
      $('list').replaceChildren();
      if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent=rows.length?'No messages match your search.':'No enquiries yet.';$('list').append(p)}
      for(const row of visible){
        const button=document.createElement('button');button.type='button';button.className='item'+(row.id===selected?' active':'');
        const line=document.createElement('span');line.className='row';
        const name=document.createElement('strong');name.textContent=row.name;
        const time=document.createElement('time');time.dateTime=row.created_at;time.textContent=date(row.created_at);
        line.append(name,time);
        const email=document.createElement('span');email.className='subject';email.textContent=row.email;
        const snippet=document.createElement('span');snippet.className='snippet';snippet.textContent=row.message.replace(/\s+/g,' ').slice(0,100);
        button.append(line,email,snippet);button.addEventListener('click',()=>{selected=row.id;render()});$('list').append(button);
      }
      const row=rows.find(x=>x.id===selected);
      $('detail').replaceChildren();
      if(row){
        const title=document.createElement('h2');title.textContent=row.name;
        const meta=document.createElement('p');meta.className='meta';meta.textContent='Received '+date(row.created_at);
        const mail=document.createElement('a');mail.className='email';mail.href='mailto:'+encodeURIComponent(row.email);mail.textContent='Reply to '+row.email+' ↗';
        const message=document.createElement('div');message.className='message';message.textContent=row.message;
        $('detail').append(title,meta,mail,message);
      }else{const p=document.createElement('p');p.className='empty';p.textContent='Select a message to read it.';$('detail').append(p)}
      $('page-label').textContent='Page '+page;$('previous').disabled=page===1;$('next').disabled=!hasMore;
    }
    async function load(){
      $('notice').textContent='';
      try{
        const res=await fetch('/api/admin/enquiries?page='+page,{cache:'no-store'});
        if(res.status===401){showLogin();return}
        if(!res.ok)throw Error('Could not load enquiries. Please refresh the page.');
        const data=await res.json();rows=data.enquiries;hasMore=data.hasMore;
        if(!rows.some(x=>x.id===selected))selected=rows[0]?.id||null;
        showPanel();render();
      }catch(err){$('notice').textContent=err.message;showPanel()}
    }
    $('login-form').addEventListener('submit',async e=>{
      e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;$('login-error').textContent='';
      try{
        const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});
        const data=await res.json();if(!res.ok)throw Error(data.error||'Could not sign in');
        $('password').value='';page=1;await load();
      }catch(err){$('login-error').textContent=err.message}finally{button.disabled=false}
    });
    $('logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});rows=[];selected=null;showLogin()});
    $('refresh').addEventListener('click',load);
    $('search').addEventListener('input',render);
    $('previous').addEventListener('click',()=>{if(page>1){page--;load()}});
    $('next').addEventListener('click',()=>{if(hasMore){page++;load()}});
    load();
  </script>
</body>
</html>
